[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "udt-adapter"
version = "0.1.0"
description = "Reproducible research on test-time intervention for frozen Decision Transformers"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
