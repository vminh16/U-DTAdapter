[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "udt-adapter"
version = "0.1.0"
description = "Reproducible research on test-time intervention for frozen Decision Transformers"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
dependencies = [
    "numpy>=1.23,<3",
    "h5py>=3.8,<4",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
baseline-dt = [
    "transformers>=4.5,<4.19",
]
pilot = [
    "transformers>=4.5,<4.19",
    "gymnasium[mujoco]==1.2.3",
    "mujoco==3.3.7",
]

[project.scripts]
udt = "udt.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
