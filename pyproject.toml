[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "udt-adapter"
version = "0.1.0"
description = "Reproducible research on test-time intervention for frozen Decision Transformers"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.md"}
dependencies = ["numpy>=1.23,<3"]

[project.optional-dependencies]
data = ["h5py>=3.8,<4"]
dev = ["pytest>=7,<9"]

[project.scripts]
udt = "udt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
